# =============================================================================
# MLOps CI/CD Pipeline - Lab 2 (end-to-end)
#
# code-quality          : lint + SAST (Bandit) + dependency audit (pip-audit)
# train-and-register    : train -> QUALITY GATE -> register -> pytest -> upload artifacts
# build-scan-smoke      : build image -> Trivy (CVE + secret) -> chạy container -> smoke test
#
# Nguyên tắc: model kém chất lượng hoặc image có lỗ hổng Critical/High
#             đều KHÔNG được đi tiếp trong pipeline.
# =============================================================================
name: MLOps CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read   # quyền tối thiểu (least privilege)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mlops-iris-api
  ACCURACY_THRESHOLD: "0.90"

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Cổng chất lượng mã nguồn & chuỗi cung ứng
  # ------------------------------------------------------------------
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: SAST with Bandit
        run: bandit -r app.py train.py monitor_drift.py tests -ll

      # pip-audit quét toàn bộ cây dependency (kể cả transitive).
      # PYSEC-2026-3552: cryptography<50 bị CVE, nhưng mlflow 3.15.1 khoá
      # `cryptography<50` nên chưa thể nâng. Đã đánh giá: image serving không
      # dùng code path liên quan (chỉ kéo theo qua mlflow auth/S3 signing).
      # >>> GỎ --ignore-vuln này khi mlflow phát hành bản cho phép >=50.0.0 <<<
      - name: Dependency audit with pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3552

  # ------------------------------------------------------------------
  # JOB 2: Train + Quality Gate + Register + Unit test API
  # ------------------------------------------------------------------
  train-and-register:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train model (chứa quality gate theo accuracy)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python train.py --accuracy-threshold ${{ env.ACCURACY_THRESHOLD }}

      - name: Run API unit tests (pytest với model thật)
        run: pytest tests -v

      - name: Upload serving artifacts cho job build
        uses: actions/upload-artifact@v4
        with:
          name: serving-artifacts
          path: artifacts/
          retention-days: 7

  # ------------------------------------------------------------------
  # JOB 3: Build image + Quét bảo mật + Smoke test
  # ------------------------------------------------------------------
  build-scan-smoke:
    runs-on: ubuntu-latest
    needs: train-and-register
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download serving artifacts
        uses: actions/download-artifact@v4
        with:
          name: serving-artifacts
          path: artifacts/

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Quét cấu hình tĩnh (Dockerfile/IaC) theo chuẩn CIS: chạy non-root,
      # không pin latest, không cài không cần thiết... Chặn trước cả khi build.
      - name: Scan Dockerfile misconfigurations (Trivy config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          exit-code: "1"
          severity: "HIGH,CRITICAL"

      - name: Scan image with Trivy (fail nếu có CVE Critical/High hoặc secret lộ)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          scanners: "vuln,secret"

      - name: Start container
        run: |
          docker run -d --name iris-api -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test API (/health rồi /predict)
        run: |
          set -e
          echo "-- Chờ service sẵn sàng..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "❌ Service không lên sau 60 giây"; docker logs iris-api; exit 1
            fi
          done

          echo "-- Kiểm tra /health phải 'healthy'..."
          HEALTH=$(curl -sf http://localhost:8000/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"healthy"' || { echo "❌ Health check thất bại"; exit 1; }

          echo "-- Gửi mẫu predict setosa..."
          RESP=$(curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"sepal_length_cm":5.1,"sepal_width_cm":3.5,"petal_length_cm":1.4,"petal_width_cm":0.2}')
          echo "$RESP"
          echo "$RESP" | grep -q '"predicted_class":"setosa"' || { echo "❌ Kết quả dự đoán sai"; exit 1; }
          echo "✅ Smoke test PASSED"

      - name: Cleanup container
        if: always()
        run: docker rm -f iris-api || true

      # Bật khi đã cấu hình secrets DOCKER_HUB_USERNAME / DOCKER_HUB_TOKEN
      # - name: Push image
      #   run: |
      #     echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
      #     docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} <dockerhub-user>/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #     docker push <dockerhub-user>/${{ env.IMAGE_NAME }}:${{ github.sha }}
